    target: /btw
  暂停:
    type: alias
    target: /pause
  对讲:
    type: alias
    target: /voice on
  静音:
    type: alias
    target: /voice off
  计划:
    type: alias
    target: /plan
  变更:
    type: alias
    target: /diff
  记忆:
    type: alias
    target: /memory
  平台:
    type: alias
    target: /platform
  学习:
    type: alias
    target: /learn
  调试:
    type: alias
    target: /debug
  更新:
    type: alias
    target: /update
  重启:
    type: alias
    target: /restart
  语音:
    type: alias
    target: /voice
  忙时:
    type: alias
    target: /busy
  设主频道:
